services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    volumes:
      - ./server:/app
    environment:
      - DATABASE_URL=postgresql://postgres:local_secure_password@postgres_db:5432/scribe_db
    stdin_open: true
    tty: true
    working_dir: /app
    depends_on:
      postgres_db:
        condition: service_healthy

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    environment:
      - VITE_API_PROXY_TARGET=http://server:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      - server
    command: npm run dev

  postgres_db:
    image: postgres:15-alpine
    container_name: kinetics_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_secure_password
      POSTGRES_DB: scribe_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
